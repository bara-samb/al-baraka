# Met le site (PWA) en ligne sur Cloudflare Pages à chaque push sur main.
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare avec la permission « Cloudflare Pages : Edit »
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
# Voir DEPLOIEMENT.md.
name: Déploiement du site

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Adresse publique (non secrète) des récitations sur Internet Archive.
      EXPO_PUBLIC_AUDIO_BASE_URL: https://archive.org/download/al-baraka-serigne-aboul-baraka-mbacke-warsh/audios/serigne-aboul-baraka-mbacke/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build:web

      - name: Mise en ligne sur Cloudflare Pages
        run: npx wrangler pages deploy --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
