<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Les couleurs sont celles de l'app (thème clair/sombre choisi dans l'app) : « only »
         interdit au navigateur de les repeindre (mode sombre forcé de Chrome Android,
         Samsung Internet…), quel que soit le mode du téléphone ou du PC. Mis à jour par
         ThemeContext selon le thème de l'app. -->
    <meta name="color-scheme" content="only light" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Le Saint Coran en riwaya Warsh, récité par Serigne Aboul Baraka Mbacké : Mushaf, écoute verset par verset, chapelet." />

    <!-- Aperçu des liens partagés (WhatsApp, Facebook, X…) : photo carrée générée par scripts/make-icons.py -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AL BARAKA" />
    <meta property="og:url" content="https://al-baraka-app.pages.dev/" />
    <meta property="og:title" content="AL BARAKA · Le Saint Coran récité par Serigne Aboul Baraka Mbacké" />
    <meta property="og:description" content="Le Saint Coran en riwaya Warsh : Mushaf, écoute verset par verset, chapelet. Gratuit, installable et utilisable hors ligne." />
    <meta property="og:image" content="https://al-baraka-app.pages.dev/og-photo.jpg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Serigne Aboul Baraka Mbacké" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AL BARAKA · Le Saint Coran récité par Serigne Aboul Baraka Mbacké" />
    <meta name="twitter:description" content="Le Saint Coran en riwaya Warsh : Mushaf, écoute verset par verset, chapelet." />
    <meta name="twitter:image" content="https://al-baraka-app.pages.dev/og-photo.jpg" />

    <!-- PWA : installation sur l'écran d'accueil + fonctionnement hors ligne (voir sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AL BARAKA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0b3a2b;
      }
      /* Ni mode sombre forcé, ni agrandissement automatique du texte par le navigateur. */
      html {
        color-scheme: only light;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Samsung Internet (et d'autres navigateurs Android) n'assombrissent pas un site qui
         déclare gérer lui-même le mode sombre : cette règle sert de déclaration. */
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #0b3a2b;
        }
      }
      /* iPhone (Safari) : pas de zoom au double appui (chapelet tapé rapidement), pas de reflet
         gris à chaque appui, ni de sélection du texte ou de menu « Copier » sur un appui long
         (versets du Mushaf). Le zoom à deux doigts reste possible. */
      html {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Écran d'accueil affiché pendant le premier chargement de l'app (remplacé par l'app). */
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; background: #0b3a2b; color: #f6e7b8;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
      }
      #splash img { width: 96px; height: 96px; border-radius: 22px; }
      #splash h1 { margin: 6px 0 0; font-size: 30px; letter-spacing: 5px; color: #fff; font-weight: 800; }
      #splash p { margin: 0; font-size: 15px; color: #d8b566; }
      #splash i {
        margin-top: 18px; width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid rgba(216, 181, 102, 0.25); border-top-color: #d8b566;
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      /* Bandeau « nouvelle version » (voir le script en bas de page). */
      #update-banner {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        max-width: calc(100% - 32px);
        padding: 10px 18px;
        border: 1px solid #c9a24a;
        border-radius: 22px;
        background: #0b3a2b;
        color: #f6e7b8;
        font: 14px system-ui, -apple-system, 'Segoe UI', sans-serif;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }
      #update-banner[hidden] { display: none; }
      #update-banner b { color: #e4c985; }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Activez JavaScript pour utiliser AL BARAKA.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="splash">
        <img src="/icons/icon-192.png" alt="" />
        <h1>AL BARAKA</h1>
        <p>Le Saint Coran en riwaya Warsh</p>
        <i></i>
      </div>
    </div>

    <script>
      // Le service worker n'est enregistré que pour l'app exportée (`npm run build:web`) :
      // en développement, il mettrait en cache les bundles et masquerait les modifications.
      window.addEventListener('load', function () {
        var isDevBundle = Array.prototype.some.call(document.scripts, function (s) {
          return s.src.indexOf('dev=true') !== -1;
        });
        if ('serviceWorker' in navigator && !isDevBundle) {
          navigator.serviceWorker.register('/sw.js').catch(function (e) {
            console.warn('Service worker non enregistré :', e);
          });
          // Nouvelle version prête (voir sw.js) : bandeau pour la charger. Pas de rechargement
          // automatique, qui couperait une récitation en cours.
          navigator.serviceWorker.addEventListener('message', function (e) {
            if (e.data === 'update-ready') document.getElementById('update-banner').hidden = false;
          });
          // Sur téléphone, l'app installée reste en mémoire : on vérifie à chaque retour au
          // premier plan (nouvelle version de l'app et du service worker).
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState !== 'visible') return;
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) reg.update().catch(function () {});
            });
            if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('check-update');
          });
        }
      });
    </script>
    <button id="update-banner" type="button" hidden onclick="location.reload()">
      Nouvelle version d'AL BARAKA · <b>Mettre à jour</b>
    </button>
  </body>
</html>
