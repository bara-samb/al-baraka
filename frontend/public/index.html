<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Les couleurs sont celles de l'app (thème clair/sombre choisi dans l'app) : « only »
         interdit au navigateur de les repeindre (mode sombre forcé de Chrome Android,
         Samsung Internet…), quel que soit le mode du téléphone ou du PC. Mis à jour par
         ThemeContext selon le thème de l'app. -->
    <meta name="color-scheme" content="only light" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Le Saint Coran en riwaya Warsh, récité par Serigne Aboul Baraka Mbacké : Mushaf, écoute verset par verset, chapelet." />

    <!-- Aperçu des liens partagés (WhatsApp, Facebook, X…) : photo carrée générée par scripts/make-icons.py -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AL BARAKA" />
    <meta property="og:url" content="https://al-baraka-app.pages.dev/" />
    <meta property="og:title" content="AL BARAKA · Le Saint Coran récité par Serigne Aboul Baraka Mbacké" />
    <meta property="og:description" content="Le Saint Coran en riwaya Warsh : Mushaf, écoute verset par verset, chapelet. Gratuit, installable et utilisable hors ligne." />
    <meta property="og:image" content="https://al-baraka-app.pages.dev/og-photo.jpg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Serigne Aboul Baraka Mbacké" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AL BARAKA · Le Saint Coran récité par Serigne Aboul Baraka Mbacké" />
    <meta name="twitter:description" content="Le Saint Coran en riwaya Warsh : Mushaf, écoute verset par verset, chapelet." />
    <meta name="twitter:image" content="https://al-baraka-app.pages.dev/og-photo.jpg" />

    <!-- PWA : installation sur l'écran d'accueil + fonctionnement hors ligne (voir sw.js) -->
    <!-- Récitations sur archive.org : connexion ouverte dès le chargement de la page. -->
    <link rel="preconnect" href="https://archive.org" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AL BARAKA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0b3a2b;
      }
      /* Ni mode sombre forcé, ni agrandissement automatique du texte par le navigateur. */
      html {
        color-scheme: only light;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Samsung Internet (et d'autres navigateurs Android) n'assombrissent pas un site qui
         déclare gérer lui-même le mode sombre : cette règle sert de déclaration. */
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #0b3a2b;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Activez JavaScript pour utiliser AL BARAKA.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script>
      // Le service worker n'est enregistré que pour l'app exportée (`npm run build:web`) :
      // en développement, il mettrait en cache les bundles et masquerait les modifications.
      window.addEventListener('load', function () {
        var isDevBundle = Array.prototype.some.call(document.scripts, function (s) {
          return s.src.indexOf('dev=true') !== -1;
        });
        if ('serviceWorker' in navigator && !isDevBundle) {
          navigator.serviceWorker.register('/sw.js').catch(function (e) {
            console.warn('Service worker non enregistré :', e);
          });
        }
      });
    </script>
  </body>
</html>
